<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Performance Indicator</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login {
        background: #ffffff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        width: 400px;
        animation: fadeInSlide 1s ease forwards;
    }

    @keyframes fadeInSlide {
        0% { opacity: 0; transform: translateY(-30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        color: #4e54c8;
        margin-bottom: 20px;
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }

    form div {
        margin-bottom: 15px;
        position: relative;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: #333;
    }

    select, input[type="number"] {
        width: 100%;
        padding: 10px 15px;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: all 0.3s ease;
        font-size: 16px;
    }

    select:focus, input[type="number"]:focus {
        border-color: #4e54c8;
        box-shadow: 0 0 5px #8f94fb;
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #4e54c8, #8f94fb);
        border: none;
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.5s;
    }

    input[type="submit"]:hover {
        background: linear-gradient(to left, #4e54c8, #8f94fb);
    }

    @media(max-width: 450px){
        .login { width: 90%; padding: 20px; }
    }
</style>
</head>
<body>
    <div class="login">
       <h1>Student Exam Performance Indicator</h1>
       <h2>Student Exam Performance Prediction</h2>
   
       <form action="{{ url_for('predict')}}" method="post">
        <div>
            <label>Gender</label>
            <select name="gender" required>
                <option selected disabled value="">Select your Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div>
            <label>Race or Ethnicity</label>
            <select name="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>
        <div>
            <label>Parental Level of Education</label>
            <select name="parental_level_of_education" required>
                <option selected disabled value="">Select Parent Education</option>
                <option value="associate's degree">associate's degree</option>
                <option value="bachelor's degree">bachelor's degree</option>
                <option value="high school">high school</option>
                <option value="master's degree">master's degree</option>
                <option value="some college">some college</option>
                <option value="some high school">some high school</option>
            </select>
        </div>
        <div>
            <label>Lunch Type</label>
            <select name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="free/reduced">free/reduced</option>
                <option value="standard">standard</option>
            </select>
        </div>
        <div>
            <label>Test preparation Course</label>
            <select name="test_preparation_course" required>
                <option selected disabled value="">Select Test Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        <div>
            <label>Writing Score out of 100</label>
            <input type="number" name="writing_score" min="0" max="100" required />
        </div>
        <div>
            <label>Reading Score out of 100</label>
            <input type="number" name="reading_score" min="0" max="100" required />
        </div>
        <div>
            <input type="submit" value="Predict your Maths Score" />
        </div>
       </form>
    </div>
</body>
</html>
